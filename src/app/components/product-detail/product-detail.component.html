<!-- Loading skeleton -->
<div class="skeleton-wrap" *ngIf="loading">
  <div class="skeleton skeleton-img"></div>
  <div class="skeleton-info">
    <div class="skeleton skeleton-line w60"></div>
    <div class="skeleton skeleton-line w40"></div>
    <div class="skeleton skeleton-line w80"></div>
    <div class="skeleton skeleton-line w50"></div>
  </div>
</div>

<!-- Product detail -->
<div class="detail-page" *ngIf="!loading && product">

  <!-- Breadcrumb -->
  <nav class="breadcrumb">
    <a routerLink="/products">Produits</a>
    <span class="sep">›</span>
    <span *ngIf="product.category">{{ product.category }}</span>
    <span class="sep" *ngIf="product.category">›</span>
    <span class="current">{{ product.name }}</span>
  </nav>

  <div class="detail-grid">

    <!-- Gauche : Image -->
    <div class="image-col">
      <div class="image-frame">
        <img [src]="product.image" [alt]="product.name" />
        <div class="category-tag" *ngIf="product.category">{{ product.category }}</div>
      </div>
    </div>

    <!-- Droite : Infos -->
    <div class="info-col">

      <h1 class="product-name">{{ product.name }}</h1>

      <div class="price-row">
        <span class="price">{{ product.price }} DT</span>
        <span class="price-label">Prix TTC</span>
      </div>

      <div class="divider"></div>

      <p class="description">{{ product.description }}</p>

      <!-- Caractéristiques -->
      <div class="features">
        <div class="feature">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12l5 5L20 7"/>
          </svg>
          Livraison rapide 24/48h
        </div>
        <div class="feature">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12l5 5L20 7"/>
          </svg>
          Retour gratuit 30 jours
        </div>
        <div class="feature">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12l5 5L20 7"/>
          </svg>
          Paiement 100% sécurisé
        </div>
      </div>

      <div class="divider"></div>

      <!-- Quantité -->
      <div class="qty-row">
        <span class="qty-label">Quantité</span>
        <div class="qty-control">
          <button class="qty-btn" (click)="decrement()" [disabled]="quantity === 1">−</button>
          <span class="qty-value">{{ quantity }}</span>
          <button class="qty-btn" (click)="increment()" [disabled]="quantity === 10">+</button>
        </div>
      </div>

      <!-- Ajouter au panier -->
      <button class="btn-cart" (click)="addToCart()" [class.added]="added">
        <ng-container *ngIf="!added">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/>
          </svg>
          Ajouter au panier — {{ product.price * quantity }} DT
        </ng-container>
        <ng-container *ngIf="added">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          Ajouté au panier !
        </ng-container>
      </button>

      <a routerLink="/products" class="btn-back">
        ← Retour aux produits
      </a>

    </div>
  </div>
</div>
