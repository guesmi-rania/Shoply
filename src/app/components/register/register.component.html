<div class="auth-page">
    <!-- Left panel: branding -->
    <div class="brand-panel">
      <div class="brand-content">
        <div class="logo">
          <span class="logo-icon">🛍️</span>
          <span class="logo-text">Shoply</span>
        </div>
        <h1 class="brand-headline">Join the<br>community.</h1>
        <p class="brand-sub">Create your account and start shopping today.</p>
        <div class="floating-cards">
          <div class="fcard fcard-1">🎁 Welcome gift on first order</div>
          <div class="fcard fcard-2">🚀 Fast & free returns</div>
          <div class="fcard fcard-3">⭐ Exclusive member deals</div>
        </div>
      </div>
      <div class="brand-blob"></div>
    </div>
  
    <!-- Right panel: form -->
    <div class="form-panel">
      <div class="form-container">
        <div class="form-header">
          <h2>Create account</h2>
          <p>It's free and only takes a minute</p>
        </div>
  
        <div class="error-msg" *ngIf="error">⚠️ {{ error }}</div>
  
        <div class="success-msg" *ngIf="success">✅ {{ success }}</div>
  
        <form (ngSubmit)="onSubmit()" #regForm="ngForm">
          <div class="field">
            <label for="name">Full name</label>
            <div class="input-wrap">
                <span class="input-icon">👩‍💻</span>
                <input
                id="name"
                type="text"
                [(ngModel)]="name"
                name="name"
                placeholder="Rania Guesmi"
                required
              />
            </div>
          </div>
  
          <div class="field">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input
                id="email"
                type="email"
                [(ngModel)]="email"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>
  
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">🔑</span>
              <input
                id="password"
                type="password"
                [(ngModel)]="password"
                name="password"
                placeholder="Minimum 8 characters"
                required
                minlength="8"
              />
            </div>
          </div>
  
          <div class="checkbox-field">
            <input type="checkbox" id="terms" [(ngModel)]="terms" name="terms" />
            <label for="terms">
              I agree to the <a routerLink="/terms">Terms of Service</a> and <a routerLink="/privacy">Privacy Policy</a>
            </label>
          </div>
  
          <button type="submit" class="btn-primary" [disabled]="loading">
            <span *ngIf="!loading">Create Account →</span>
            <span *ngIf="loading" class="spinner"></span>
          </button>
        </form>
  
        <div class="divider"><span>or</span></div>
  
        <div class="signup-prompt">
          Already have an account?
          <a routerLink="/login">Sign in</a>
        </div>
      </div>
    </div>
  </div>
